<!DOCTYPE html>
<html>
<head>
  <title>Password — MyApp</title>
  <script src="http://{{ cdn }}/cdn/lib.js"></script>
</head>
<body>
  <h1>Welcome, {{ email }}</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST" action="/password">
    <input type="hidden" name="flow_id" value="{{ flow_id }}">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="fingerprint" value="fp-demo-1234">
    <input type="hidden" name="tz_offset" value="-300">
    <label>Password: <input type="password" name="password" required autofocus></label><br>
    <label><input type="checkbox" name="stay_signed_in" value="1"> Stay signed in</label><br>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
