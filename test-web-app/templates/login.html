<!DOCTYPE html>
<html>
<head>
  <title>Sign in — MyApp</title>
  <link rel="icon" href="http://{{ assets }}/assets/logo.txt">
  <script src="http://{{ cdn }}/cdn/lib.js"></script>
</head>
<body>
  <h1>Sign in to MyApp</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="POST" action="/login">
    <input type="hidden" name="flow_id" value="{{ flow_id }}">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email: <input type="email" name="email" required autofocus></label><br>
    <label><input type="checkbox" name="remember_me" value="1"> Remember me</label><br>
    <button type="submit">Continue</button>
  </form>
  <script src="http://{{ cdn }}/cdn/login.js"></script>
</body>
</html>
